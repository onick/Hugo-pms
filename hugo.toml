baseURL = "https://www.silexpms.com/"
languageCode = "es-DO"
title = "SilexPMS — El PMS del Caribe"

[build]
  writeStats = true

[params]
  description = "La plataforma hotelera de nueva generación para hoteles independientes y boutique del Caribe."
  # Cutover from hotelmate (app.silexpms.com) to Silex.
  # registerUrl → public signup creates a fresh tenant on silexpms.com
  # loginUrl    → tenant locator (asks email, redirects to subdomain)
  appUrl      = "https://silexpms.com"
  registerUrl = "https://silexpms.com/signup"
  loginUrl    = "https://silexpms.com/find-hotel"
  heroVideo    = "/video/hero.mp4"
  heroImage    = "/video/hero-poster.jpg"
  demoFormUrl  = "https://api.silexpms.com/api/leads"  # Laravel API + Resend
  demoWhatsApp = "18094943702"  # Tu WhatsApp (sin + ni espacios)

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Disable taxonomies — we don't use categories or tags on the landing,
# and keeping them creates /categories/ and /tags/ listing pages that
# are both in the sitemap AND Disallow'd in robots.txt — a conflict
# that Search Console flags as an error.
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  minifyOutput = true
