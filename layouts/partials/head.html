<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0B">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- Open Graph -->
<meta property="og:type"        content="website">
<meta property="og:url"         content="{{ .Permalink }}">
<meta property="og:title"       content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:image"       content="{{ .Site.BaseURL }}og-image.jpg">
<meta property="og:image:type"  content="image/jpeg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="676">
<meta property="og:image:alt"   content="SilexPMS — El PMS del Caribe">
<meta property="og:locale"      content="es_DO">
<meta property="og:site_name"   content="SilexPMS">

<!-- Twitter -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="{{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.description }}">
<meta name="twitter:image"       content="{{ .Site.BaseURL }}og-image.jpg">
<meta name="twitter:image:alt"   content="SilexPMS — El PMS del Caribe">

<!-- Canonical + hreflang — Caribbean Spanish-speaking markets routed to same URL
     until we publish localised content. Helps Google serve the right regional
     result without duplicating SEO weight. -->
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" hreflang="es-DO" href="{{ .Permalink }}">
<link rel="alternate" hreflang="es-PR" href="{{ .Permalink }}">
<link rel="alternate" hreflang="es-MX" href="{{ .Permalink }}">
<link rel="alternate" hreflang="es"    href="{{ .Permalink }}">
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Preload the hero poster to accelerate LCP. The hero section uses this
     image as the <video poster>, which browsers treat as LCP candidate
     until the video frame decodes. Fetching it early is worth ~400ms on
     mobile 4G. -->
{{- if .IsHome -}}
<link rel="preload" as="image" href="/video/hero-poster.jpg" fetchpriority="high">
{{- end }}

<!-- Self-hosted Plus Jakarta Sans (variable font) — eliminates the
     round-trip to fonts.googleapis.com (render-blocking) and lets
     Cloudflare cache the .woff2 files at the edge alongside our HTML.
     Subset to latin + latin-ext = ~48 KB for all 5 weights. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin.woff2" crossorigin>
{{- $fontCss := resources.Get "css/fonts.css" | resources.Fingerprint -}}
<link rel="stylesheet" href="{{ $fontCss.RelPermalink }}">

<!-- Tailwind via Hugo Pipes -->
{{- $css := resources.Get "css/main.css" | css.TailwindCSS (dict "minify" hugo.IsProduction) | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

<!-- ═══ Structured Data (JSON-LD) ═══ -->

<!-- Organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "SilexPMS",
  "alternateName": "Silex PMS",
  "url": "https://www.silexpms.com",
  "logo": "https://www.silexpms.com/favicon.svg",
  "description": "Sistema de Gestión Hotelera (PMS) de nueva generación para hoteles independientes y boutique del Caribe",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Santo Domingo",
    "addressCountry": "DO"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+1-809-494-3702",
    "contactType": "Customer Service",
    "availableLanguage": "Spanish"
  }
}
</script>

<!-- SoftwareApplication
     NOTE: aggregateRating intentionally omitted until we reach ≥10
     verified reviews. Google treats <10 as "rich result unreliable"
     and hides the stars, so keeping it here hurts more than helps.
     Re-add when the Capterra / G2 listings reach that threshold. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "SilexPMS",
  "description": "Plataforma hotelera con gestión de reservas, front desk, housekeeping, facturación fiscal e-CF y analytics integrados",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web",
  "inLanguage": "es-DO",
  "offers": {
    "@type": "AggregateOffer",
    "priceCurrency": "USD",
    "lowPrice": "29",
    "highPrice": "129",
    "offerCount": "3"
  }
}
</script>

      }

    {

      "name": "¿Cuánto cuesta Silex PMS?",

        "@type": "Answer",

      }
    }

</script>
