<section class="py-28 relative overflow-hidden" style="background:#0D1F12">

  <!-- Subtle grid -->
  <div style="position:absolute; inset:0; pointer-events:none; opacity:0.03;
              background-image:linear-gradient(to right,#fff 1px,transparent 1px),
                               linear-gradient(to bottom,#fff 1px,transparent 1px);
              background-size:64px 64px;"></div>

  <div class="relative max-w-3xl mx-auto px-4 sm:px-6 text-center space-y-8">

    <h2 class="text-[clamp(2.2rem,4vw+1rem,3.5rem)] font-extrabold tracking-tight leading-[1.1] text-white">
      Deja de pelear con tu software.
      <br><span class="text-[var(--color-accent)]">Empieza a hospedar.</span>
    </h2>

    <p style="font-family:var(--font-sans); font-size:1.1rem; line-height:1.6; color:rgba(255,255,255,0.5); max-width:480px; margin:0 auto;">
      Únete a los hoteleros que ya gestionan su hotel sin fricción,
      con facturación fiscal integrada y soporte en español.
    </p>

    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;">
      <a href="{{ .Site.Params.registerUrl }}"
         style="background:#E9FF57; color:#0D1F12; display:inline-block; font-weight:700; border-radius:9999px; height:3.5rem; padding:0 3.5rem; font-size:1.125rem; line-height:3.5rem; transition:all 0.2s; text-decoration:none;">
        Crear mi cuenta gratis ↗
      </a>
      <button onclick="openDemoModal()"
              style="background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,0.2); cursor:pointer;
                     font-family:var(--font-sans); font-weight:600; border-radius:9999px; height:3.5rem;
                     padding:0 2.5rem; font-size:1rem; transition:all 0.2s;"
              onmouseover="this.style.borderColor='rgba(255,255,255,0.5)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.2)'">
        Solicitar demo →
      </button>
    </div>

    <p class="text-white/40 text-sm">
      ✓ Sin tarjeta de crédito &nbsp;·&nbsp; ✓ 14 días gratis &nbsp;·&nbsp; ✓ Cancela cuando quieras
    </p>

  </div>
</section>
